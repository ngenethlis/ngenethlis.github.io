name: Update books from Hardcover

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours, offset from the Letterboxd job
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: hardcover-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch reading / last-read books
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: python3 scripts/update_hardcover.py ngenethlis

      - name: Commit if changed
        run: |
          if git diff --quiet -- hardcover-last.json && git ls-files --error-unmatch hardcover-last.json >/dev/null 2>&1; then
            echo "No change in books."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardcover-last.json
          git commit -m "Update books from Hardcover"
          git push
